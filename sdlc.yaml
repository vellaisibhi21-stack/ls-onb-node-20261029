    require_milestone: true
    require_issues_assigned: true
  development:
    branch: main
    deploy_target: dev
    required_checks:
      - Unit tests
      - Lint
    required_reviewers:
      min_approvals: 0
  testing:
    branch_pattern: main
    required_checks:
      - Unit tests
      - Lint
    required_reviewers:
      min_approvals: 1
  evidencing:
    required_reviewers:
      min_approvals: 1
  deployment:
    target: production
    required_checks: []
    promotion: manual
    requires_evidence_approval: true
